<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学练习</title>
<meta name="description" content="新版数学练习。也可以切回原来的知识图谱和诊断。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20fill%3D%22%23dff3ef%22%20stroke%3D%22%230f6e62%22%20stroke-width%3D%221.7%22%20stroke-linejoin%3D%22round%22%20d%3D%22M6.6%204.8H17L27.4%2015.2V25Q27.4%2027.4%2025.2%2027.4H6.6Q4.4%2027.4%204.4%2025.2V7Q4.4%204.8%206.6%204.8Z%22%2F%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M17.7%206.3%2026.1%2014.7H17.7Z%22%2F%3E%3Cpath%20fill%3D%22none%22%20stroke%3D%22%230f6e62%22%20stroke-width%3D%221.35%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20d%3D%22M17.7%206.3V14.7H26.1%22%2F%3E%3Cpath%20fill%3D%22none%22%20stroke%3D%22%230f6e62%22%20stroke-width%3D%222.15%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20d%3D%22M8.3%2024.2H12.4Q14.2%2024.2%2014.2%2022.4V20.2Q14.2%2018.6%2016%2018.6H18.8%22%2F%3E%3Cpath%20fill%3D%22%230f6e62%22%20d%3D%22M18.5%2016.85%2023%2018.6%2018.5%2020.35Z%22%2F%3E%3C%2Fsvg%3E">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6fed">
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: #eef1f6; color: #1d2433; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .switch { display: flex; gap: 8px; align-items: center; flex: none; padding: 8px 12px; background: #fff; border-bottom: 1px solid #e3e8f0; }
  .switch span { font-weight: 700; margin-right: 8px; }
  .switch a { text-decoration: none; color: #3a4558; border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  .switch a.on { background: #2f6fed; color: #fff; }
  iframe { flex: 1; width: 100%; border: 0; background: #f4f6fb; }
</style>
</head>
<body>
<nav class="switch" aria-label="切换入口">
  <span>数学练习</span>
  <a id="go-new" href="#new">新版练习</a>
  <a id="go-old" href="#old">原来的站点</a>
</nav>
<iframe id="view" title="当前入口" src="about:blank"></iframe>
<script>
(function () {
  var hash = location.hash.replace(/^#/, "");
  try { hash = decodeURIComponent(hash); } catch (e) { /* 保持原样 */ }
  var topicRoutes = {
    cnm_: "explore/#",
    cne_: "explore/?subject=english#",
    cnp_: "explore/?subject=physics#",
    cnc_: "explore/?subject=chinese#",
    cns_: "explore/?subject=science#",
    cnd_: "explore/?subject=morality#",
    cnh_: "explore/?subject=history#",
    cng_: "explore/?subject=geography#",
    cnb_: "explore/?subject=biology#",
    cnk_: "explore/?subject=chemistry#"
  };
  var topic = /^(cnm_|cne_|cnp_|cnc_|cns_|cnd_|cnh_|cng_|cnb_|cnk_)[A-Za-z0-9]+$/.exec(hash);
  if (topic) {
    location.replace(topicRoutes[topic[1]] + encodeURIComponent(hash));
    return;
  }
  var frame = document.getElementById("view");
  var goNew = document.getElementById("go-new");
  var goOld = document.getElementById("go-old");
  function show(which) {
    var isNew = which !== "old";
    frame.src = isNew ? "math-coach/design/ux-redesign/prototype/#/map" : "classic.html";
    goNew.classList.toggle("on", isNew);
    goOld.classList.toggle("on", !isNew);
    if (isNew) goNew.setAttribute("aria-current", "page");
    else goNew.removeAttribute("aria-current");
    if (!isNew) goOld.setAttribute("aria-current", "page");
    else goOld.removeAttribute("aria-current");
  }
  function fromHash() { show(location.hash === "#old" ? "old" : "new"); }
  window.addEventListener("hashchange", fromHash);
  goNew.addEventListener("click", function (event) {
    event.preventDefault();
    if (location.hash !== "#new") location.hash = "new";
    else fromHash();
  });
  goOld.addEventListener("click", function (event) {
    event.preventDefault();
    if (location.hash !== "#old") location.hash = "old";
    else fromHash();
  });
  fromHash();
})();
</script>
<script src="assets/pwa.js"></script>
</body>
</html>
